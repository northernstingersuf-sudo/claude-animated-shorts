name: Accessories reel
on:
  push:
    branches: [feat/accessories-3d-20261127]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [review, production]
        default: review
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RENDER_MODE: ${{ inputs.mode || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgbm1 libasound2t64 fonts-liberation2
      - run: npm ci --no-audit --no-fund
      - run: pip install -r requirements-accessories.txt
      - run: mkdir -p out/accessories
      - run: npm run typecheck
      - run: npx remotion render src/index.ts Smoke3D out/accessories/smoke-3d.mp4 --gl=swangle --concurrency=1
      - run: python scripts/verify_video.py out/accessories/smoke-3d.mp4 --width 540 --height 960 --frames 30
      - run: python scripts/accessories-audio.py
      - name: Review stills and draft
        if: env.RENDER_MODE == 'review'
        run: node scripts/accessories-review.mjs
      - name: Reviewed full-resolution exports
        if: env.RENDER_MODE == 'production'
        run: |
          node scripts/accessories-render.mjs production
          python scripts/accessories-qa.py
          python templates/scripts/short_qa.py out/accessories/AccessoriesDontCount.mp4 out/accessories/qa/full production/accessories/shots.json
      - name: Include production notes
        if: always()
        run: cp production/accessories/{QC.md,README.md,caption.txt,shots.json} out/accessories/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-${{ env.RENDER_MODE }}-${{ github.run_id }}
          path: out/accessories/
          retention-days: 14
